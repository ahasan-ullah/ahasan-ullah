  <clipPath id="c"><rect width="560" height="380" rx="14"/></clipPath>
</defs>
<style>.t { font: 500 14.5px 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; } .h { font: 700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: 2.5px; fill: #8b9099; }</style>
